[package]
name = "solana-tpu-client-cc"
version = "0.1.0"
edition = "2021"
description = "Slot-aware congestion control for Solana TPU — adaptive send-window calibrated to validator slot timing"
license = "MIT"
repository = "https://github.com/nzengi/solana-tpu-client-cc"
keywords = ["solana", "tpu", "quic", "congestion-control", "blockchain"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[lib]
name = "solana_tpu_client_cc"
path = "src/lib.rs"

[dependencies]
solana-sdk            = "2.2"
solana-rpc-client     = "2.2"
solana-rpc-client-api = "2.2"
tokio                 = { version = "1", features = ["full"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
anyhow                = "1"
thiserror             = "1"
tracing               = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }